<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ocorrências Acadêmicas - Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="container">
        <div class="login-box">
            <h2>Acesso ao Sistema</h2>
            <p class="subtitle">Insira suas credenciais para continuar</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <div id="mainApp" class="container hidden">
        <header>
            <div class="user-info">
                <span id="userNameDisplay"></span>
                <span id="userRoleBadge" class="badge"></span>
            </div>
            <button id="logoutBtn" class="btn-secondary">Sair</button>
        </header>

        <main>
            <section id="occurrenceFormSection">
                <h3>Registrar Nova Ocorrência</h3>
                <form id="occurrenceForm">
                    <div class="grid-form">
                        <input type="text" id="studentName" placeholder="Nome do Aluno" required>
                        <input type="text" id="studentCpf" placeholder="CPF do Aluno" required>
                        <input type="email" id="studentEmail" placeholder="E-mail" required>
                        <select id="occurrenceType">
                            <option value="Pedagógica">Pedagógica</option>
                            <option value="Disciplinar">Disciplinar</option>
                            <option value="Administrativa">Administrativa</option>
                        </select>
                    </div>
                    <textarea id="description" placeholder="Descrição detalhada da ocorrência" required></textarea>
                    <button type="submit" class="btn-success">Salvar Ocorrência</button>
                </form>
            </section>

            <section id="dataSection">
                <div class="section-header">
                    <h3>Registros do Sistema</h3>
                    <div class="admin-actions hidden" id="adminActions">
                        <button id="exportBtn" class="btn-info">Exportar JSON</button>
                        <button id="clearLogsBtn" class="btn-danger">Limpar Auditoria</button>
                    </div>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por nome ou CPF...">
                </div>
                <div class="table-responsive">
                    <table id="occurrenceTable">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Aluno</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="occurrenceList"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
